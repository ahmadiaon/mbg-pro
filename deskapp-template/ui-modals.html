<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF or Image Modal with Print</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .modal-dialog {
            max-width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .modal-content {
            height: 100%;
            border: 0;
            border-radius: 0;
        }
        .modal-body {
            overflow: auto;
            height: calc(100% - 56px); /* Adjust if you have a different header height */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        #modalImage {
            width: 100%;
            height: auto;
            display: none;
        }
        #pdfIframe {
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>

<!-- Buttons to Open the Modal -->
<button type="button" class="btn btn-primary" onclick="processFile('http://127.0.0.1:8000/file/database/FILE-KARYAWAN-MBLE-0422003-FILE-KTP.pdf')">
    Open Sample PDF
</button>
<button type="button" class="btn btn-primary" onclick="processFile('https://upload.wikimedia.org/wikipedia/commons/6/63/Lambang_Kementerian_Lingkungan_Hidup_dan_Kehutanan.png')">
    Open Sample Image
</button>

<!-- The Modal -->
<div class="modal fade" id="fileModal" tabindex="-1" role="dialog" aria-labelledby="fileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="fileModalLabel">File Viewer</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <img id="modalImage" src="" alt="Image">
                <iframe id="pdfIframe" frameborder="0"></iframe>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="printButton" style="display: none;" onclick="printImage()">Print</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
async function processFile(fileUrl) {
    try {
        // Determine file type
        const fileType = await getFileType(fileUrl);

        if (fileType === 'application/pdf') {
            // If it's a PDF, display it in iframe
            document.getElementById('pdfIframe').src = fileUrl;
            document.getElementById('pdfIframe').style.display = 'block';
            document.getElementById('modalImage').style.display = 'none';
            document.getElementById('printButton').style.display = 'none';
        } else if (fileType.startsWith('image/')) {
            // If it's an image, display it and enable print button
            document.getElementById('modalImage').src = fileUrl;
            document.getElementById('modalImage').style.display = 'block';
            document.getElementById('pdfIframe').style.display = 'none';
            document.getElementById('printButton').style.display = 'block';
        } else {
            alert('Unsupported file type.');
            return;
        }
        $('#fileModal').modal('show');
    } catch (error) {
        console.error('Error processing file:', error);
    }
}

async function getFileType(url) {
    const response = await fetch(url, { method: 'HEAD' });
    return response.headers.get('Content-Type');
}

function printImage() {
    const imgSrc = document.getElementById('modalImage').src;
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
        <html>
            <head>
                <title>Print Image</title>
                <style>
                    body, html {
                        margin: 0;
                        padding: 0;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100%;
                    }
                    img {
                        max-width: 100%;
                        max-height: 100%;
                    }
                </style>
            </head>
            <body>
                <img src="${imgSrc}" alt="Image">
            </body>
        </html>
    `);
    printWindow.document.close();
    printWindow.print();
}
</script>

</body>
</html>
